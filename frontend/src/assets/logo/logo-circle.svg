<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="100%" height="100%" fill="none">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="epCircleBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2a47"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="epNavyCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2a47"/>
      <stop offset="100%" stop-color="#081c31"/>
    </linearGradient>
    
    <linearGradient id="epTealCircle" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="epTextTealCircle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <filter id="circleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0e2a47" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Circular Container -->
  <circle cx="180" cy="180" r="162" fill="#ffffff" stroke="url(#epCircleBorderGrad)" stroke-width="10" filter="url(#circleShadow)"/>

  <!-- Logo Mark -->
  <g transform="translate(80, 44)">
    <!-- Mortarboard Cap -->
    <polygon points="100,20 174,54 100,86 26,54" fill="url(#epNavyCircle)"/>
    <path d="M 48,68 Q 100,88 152,68" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 54,64 Q 52,112 100,118 Q 136,114 142,78" fill="url(#epNavyCircle)"/>
    <circle cx="100" cy="53" r="3.5" fill="#ffffff"/>
    <path d="M 98,54 Q 60,58 46,84" stroke="url(#epNavyCircle)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="46" cy="86" r="3" fill="url(#epNavyCircle)"/>
    <path d="M 43,88 L 42,110 Q 46,112 50,110 L 49,88 Z" fill="url(#epNavyCircle)"/>

    <!-- Circuit Hexagon & Traces -->
    <polygon points="126,98 156,114 156,148 126,164 96,148 96,114" fill="none" stroke="url(#epNavyCircle)" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 126,108 L 126,128" stroke="url(#epNavyCircle)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="126,108" r="3.5" fill="url(#epNavyCircle)"/>
    <path d="M 110,122 L 126,132 L 142,122" stroke="url(#epNavyCircle)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="110,122" r="3" fill="url(#epNavyCircle)"/>
    <circle cx="142,122" r="3" fill="url(#epNavyCircle)"/>
    <path d="M 114,142 L 126,134 L 138,142" stroke="url(#epNavyCircle)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="126,134" r="3" fill="url(#epNavyCircle)"/>
    <circle cx="114,142" r="3" fill="url(#epNavyCircle)"/>
    <circle cx="138,142" r="3" fill="url(#epNavyCircle)"/>

    <!-- Dynamic Blue Graph Segment -->
    <polygon points="34,150 64,114 88,138 126,92 112,80 86,114 64,94 24,144" fill="url(#epNavyCircle)"/>

    <!-- Dual Ascending Green Growth Arrows -->
    <path d="M 122,86 L 148,54 L 140,52 L 168,34 L 166,64 L 158,56 L 138,88 Z" fill="url(#epTealCircle)"/>
    <path d="M 142,82 L 166,52 L 158,50 L 192,30 L 190,64 L 182,56 L 158,86 Z" fill="url(#epTealCircle)"/>
  </g>

  <!-- Typography -->
  <text x="180" y="260" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#0e2a47">Edu</tspan><tspan fill="url(#epTextTealCircle)">Predict</tspan>
  </text>
  <text x="180" y="286" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#1e293b" letter-spacing="0.2">
    Smart Student Academic &amp;
  </text>
  <text x="180" y="300" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#1e293b" letter-spacing="0.2">
    Placement Prediction System
  </text>
</svg>
